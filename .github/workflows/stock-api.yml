name: Stock API tests

on:
  push:
    branches: [main]
    paths:
      - "projects/stock-api/**"
      - ".github/workflows/stock-api.yml"
  pull_request:
    paths:
      - "projects/stock-api/**"
      - ".github/workflows/stock-api.yml"

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r projects/stock-api/requirements.txt
      - name: Check Python syntax
        run: python -m compileall -q projects/stock-api
      - name: Run isolated API tests
        working-directory: projects/stock-api
        run: python -m pytest -q

name: Portfolio HTML checks

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "demos/**"
      - "scripts/**"
      - ".github/workflows/demo-html.yml"
  pull_request:
    paths:
      - "index.html"
      - "demos/**"
      - "scripts/**"
      - ".github/workflows/demo-html.yml"

jobs:
  html:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Run HTML checks
        run: python scripts/check_demo_html.py
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install Chromium automation
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Check demo pages at desktop and mobile widths
        run: python scripts/check_browser_pages.py
